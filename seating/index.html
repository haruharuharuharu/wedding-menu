<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4efe6">
  <meta name="robots" content="noindex, nofollow">
  <meta name="format-detection" content="telephone=no">
  <title>Seating Chart | 2026.09.27</title>

  <style>
    :root{
      --bg:#f4efe6;
      --paper:#fffdf8;
      --ink:#2c2925;
      --muted:#8a8177;
      --line:#d8c1a3;
      --shadow:0 18px 60px rgba(66,54,39,.12);
      --button:#2f2c28;
      --button-text:#fffdf8;
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      min-height:100%;
      background:var(--bg);
      color:var(--ink);
      font-family:
        "Hiragino Mincho ProN",
        "Yu Mincho",
        "YuMincho",
        "Noto Serif JP",
        serif;
      -webkit-font-smoothing:antialiased;
    }

    body{
      min-height:100svh;
      overflow-x:hidden;
    }

    button,a{font:inherit}

    .page{
      width:min(100%, 980px);
      margin:0 auto;
      padding:
        calc(30px + env(safe-area-inset-top))
        16px
        calc(48px + env(safe-area-inset-bottom));
    }

    .intro{
      text-align:center;
      padding:12px 8px 30px;
    }

    .eyebrow{
      margin:0 0 10px;
      font-family:Georgia, "Times New Roman", serif;
      font-size:11px;
      letter-spacing:.22em;
      text-transform:uppercase;
      color:var(--muted);
    }

    h1{
      margin:0;
      font-family:Georgia, "Times New Roman", serif;
      font-size:clamp(38px, 10vw, 56px);
      font-weight:400;
      line-height:1.05;
      letter-spacing:.03em;
    }

    .date{
      margin:13px 0 0;
      font-family:Georgia, "Times New Roman", serif;
      font-size:12px;
      letter-spacing:.18em;
      color:var(--muted);
    }

    .rule{
      width:38px;
      height:1px;
      margin:22px auto 0;
      background:var(--line);
    }

    .message{
      margin:0 auto 28px;
      max-width:34em;
      text-align:center;
      font-size:14px;
      line-height:2;
      letter-spacing:.04em;
    }

    .viewer-card{
      background:var(--paper);
      box-shadow:var(--shadow);
      padding:10px;
    }

    .seat-image-button{
      display:block;
      width:100%;
      padding:0;
      border:0;
      background:transparent;
      cursor:zoom-in;
    }

    .seat-image{
      display:block;
      width:100%;
      height:auto;
    }

    .actions{
      display:flex;
      justify-content:center;
      gap:10px;
      flex-wrap:wrap;
      margin:20px 0 0;
    }

    .action{
      min-height:46px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:0 20px;
      border-radius:999px;
      text-decoration:none;
      letter-spacing:.06em;
      font-size:13px;
      cursor:pointer;
    }

    .action-primary{
      border:1px solid var(--button);
      background:var(--button);
      color:var(--button-text);
    }

    .action-secondary{
      border:1px solid rgba(44,41,37,.28);
      background:transparent;
      color:var(--ink);
    }

    .hint{
      margin:14px 0 0;
      text-align:center;
      color:var(--muted);
      font-size:11px;
      line-height:1.8;
      letter-spacing:.04em;
    }

    footer{
      padding:52px 0 4px;
      text-align:center;
      color:var(--muted);
      font-family:Georgia, "Times New Roman", serif;
      font-size:11px;
      letter-spacing:.16em;
      line-height:2;
    }

    .footer-line{
      width:36px;
      height:1px;
      margin:0 auto 24px;
      background:var(--line);
    }

    /* Full-screen viewer */
    .modal{
      position:fixed;
      inset:0;
      z-index:1000;
      display:none;
      background:rgba(24,22,20,.96);
      color:white;
    }

    .modal.is-open{display:flex; flex-direction:column}

    .modal-bar{
      flex:0 0 auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:
        calc(10px + env(safe-area-inset-top))
        12px
        10px;
      border-bottom:1px solid rgba(255,255,255,.12);
      background:rgba(24,22,20,.98);
    }

    .modal-title{
      min-width:0;
      font-size:13px;
      letter-spacing:.08em;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .modal-controls{
      display:flex;
      gap:7px;
      align-items:center;
    }

    .icon-btn{
      width:38px;
      height:38px;
      border:1px solid rgba(255,255,255,.22);
      border-radius:999px;
      background:rgba(255,255,255,.08);
      color:white;
      cursor:pointer;
      font-size:18px;
      line-height:1;
    }

    .close-btn{
      width:auto;
      padding:0 14px;
      font-size:12px;
      letter-spacing:.08em;
    }

    .zoom-label{
      min-width:48px;
      text-align:center;
      font-family:Arial,sans-serif;
      font-size:11px;
      color:rgba(255,255,255,.8);
    }

    .modal-viewport{
      flex:1 1 auto;
      overflow:auto;
      padding:18px;
      text-align:center;
      overscroll-behavior:contain;
      touch-action:pan-x pan-y pinch-zoom;
    }

    .modal-image{
      display:block;
      width:100%;
      min-width:100%;
      max-width:none;
      height:auto;
      margin:0 auto;
      box-shadow:0 18px 50px rgba(0,0,0,.35);
      transition:width .12s ease;
    }

    @media (min-width:700px){
      .page{padding-left:28px;padding-right:28px}
      .viewer-card{padding:14px}
      .message{font-size:15px}
    }

    @media (max-width:520px){
      .page{padding-left:13px;padding-right:13px}
      .viewer-card{padding:6px}
      .message{font-size:13px}
      .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
      .action{padding:0 12px;font-size:12px}
      .modal-bar{align-items:flex-start}
      .modal-title{display:none}
      .modal-controls{width:100%;justify-content:center}
      .modal-viewport{padding:10px}
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="intro">
      <p class="eyebrow">Reception</p>
      <h1>Seating Chart</h1>
      <p class="date">2026.09.27</p>
      <div class="rule" aria-hidden="true"></div>
    </header>

    <p class="message">
      お名前とお席をご確認ください。<br>
      席次表をタップすると、大きく表示できます。
    </p>

    <section aria-label="披露宴 席次表">
      <div class="viewer-card">
        <button class="seat-image-button" id="openViewer" type="button" aria-label="席次表を拡大して表示">
          <img
            class="seat-image"
            src="assets/seating-chart.jpg"
            alt="2026年9月27日 ホテル椿山荘東京 披露宴席次表">
        </button>
      </div>

      <div class="actions">
        <button class="action action-primary" id="openViewer2" type="button">
          拡大して見る
        </button>
        <a class="action action-secondary" href="assets/seating-chart.pdf" target="_blank" rel="noopener">
          PDFで見る
        </a>
      </div>

      <p class="hint">
        拡大表示では「＋ / −」で倍率を変更できます。<br>
        スマートフォンではピンチ操作でも拡大できます。
      </p>
    </section>

    <footer>
      <div class="footer-line" aria-hidden="true"></div>
      HARUKI &amp; MANAMI<br>
      2026.09.27
    </footer>
  </main>

  <div class="modal" id="modal" aria-hidden="true" role="dialog" aria-modal="true" aria-label="席次表 拡大表示">
    <div class="modal-bar">
      <div class="modal-title">Seating Chart</div>
      <div class="modal-controls">
        <button class="icon-btn" id="zoomOut" type="button" aria-label="縮小">−</button>
        <span class="zoom-label" id="zoomLabel">100%</span>
        <button class="icon-btn" id="zoomIn" type="button" aria-label="拡大">＋</button>
        <button class="icon-btn close-btn" id="resetZoom" type="button">RESET</button>
        <button class="icon-btn close-btn" id="closeViewer" type="button">閉じる</button>
      </div>
    </div>

    <div class="modal-viewport" id="viewport">
      <img
        class="modal-image"
        id="modalImage"
        src="assets/seating-chart.jpg"
        alt="2026年9月27日 ホテル椿山荘東京 披露宴席次表 拡大表示">
    </div>
  </div>

  <script>
    (() => {
      const modal = document.getElementById('modal');
      const modalImage = document.getElementById('modalImage');
      const viewport = document.getElementById('viewport');
      const zoomLabel = document.getElementById('zoomLabel');
      const openButtons = [
        document.getElementById('openViewer'),
        document.getElementById('openViewer2')
      ];
      const closeButton = document.getElementById('closeViewer');
      const zoomIn = document.getElementById('zoomIn');
      const zoomOut = document.getElementById('zoomOut');
      const resetZoom = document.getElementById('resetZoom');

      let zoom = 1;
      const minZoom = 1;
      const maxZoom = 4;
      const step = .5;

      function applyZoom(){
        modalImage.style.width = `${zoom * 100}%`;
        zoomLabel.textContent = `${Math.round(zoom * 100)}%`;
      }

      function openViewer(){
        zoom = 1;
        applyZoom();
        viewport.scrollTo({top:0,left:0});
        modal.classList.add('is-open');
        modal.setAttribute('aria-hidden','false');
        document.body.style.overflow = 'hidden';
        closeButton.focus();
      }

      function closeViewer(){
        modal.classList.remove('is-open');
        modal.setAttribute('aria-hidden','true');
        document.body.style.overflow = '';
      }

      openButtons.forEach(btn => btn.addEventListener('click', openViewer));
      closeButton.addEventListener('click', closeViewer);

      zoomIn.addEventListener('click', () => {
        zoom = Math.min(maxZoom, zoom + step);
        applyZoom();
      });

      zoomOut.addEventListener('click', () => {
        zoom = Math.max(minZoom, zoom - step);
        applyZoom();
      });

      resetZoom.addEventListener('click', () => {
        zoom = 1;
        applyZoom();
        viewport.scrollTo({top:0,left:0,behavior:'smooth'});
      });

      document.addEventListener('keydown', (event) => {
        if (!modal.classList.contains('is-open')) return;
        if (event.key === 'Escape') closeViewer();
        if (event.key === '+') zoomIn.click();
        if (event.key === '-') zoomOut.click();
      });
    })();
  </script>
</body>
</html>
