<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Share Your Photos</title>
  <style>
    :root{
      --bg:#f7f5f1;
      --paper:#fffdf9;
      --text:#2f2f2f;
      --muted:#77736d;
      --line:#d9d3ca;
      --accent:#7c8571;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;
      line-height:1.9;
      -webkit-font-smoothing:antialiased;
    }
    .wrap{
      max-width:720px;
      margin:0 auto;
      padding:24px 14px 42px;
      position:relative;
      z-index:1;
    }
    .card{
      background:rgba(255,253,249,.97);
      border:1px solid var(--line);
      border-radius:22px;
      padding:42px 22px 38px;
      box-shadow:0 10px 30px rgba(0,0,0,.04);
      text-align:center;
    }
    .eyebrow{
      letter-spacing:.22em;
      font-size:12px;
      color:var(--muted);
      text-transform:uppercase;
      margin-bottom:8px;
    }
    h1{
      margin:0;
      font-size:27px;
      font-weight:500;
      letter-spacing:.08em;
    }
    .date{
      color:var(--muted);
      font-size:13px;
      letter-spacing:.08em;
      margin-top:6px;
    }
    .divider{
      width:42px;
      height:1px;
      background:var(--accent);
      margin:30px auto;
      opacity:.7;
    }
    .camera{
      width:78px;
      height:78px;
      margin:0 auto 24px;
      opacity:.68;
    }
    .camera svg{
      width:100%;
      height:100%;
      fill:none;
      stroke:var(--accent);
      stroke-width:1.4;
      stroke-linecap:round;
      stroke-linejoin:round;
    }
    .message{
      max-width:470px;
      margin:0 auto;
      font-size:15px;
      letter-spacing:.02em;
    }
    .message .sub{
      margin-top:14px;
      font-size:13px;
      color:var(--muted);
    }
    .button{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:245px;
      margin-top:32px;
      padding:15px 26px;
      border:1px solid var(--accent);
      border-radius:999px;
      color:#fffdf9;
      text-decoration:none;
      letter-spacing:.08em;
      font-size:14px;
      background:var(--accent);
      box-shadow:0 5px 14px rgba(124,133,113,.18);
      transition:.18s ease;
    }
    .button:active{
      transform:scale(.985);
      background:#68715f;
    }
    .note{
      max-width:460px;
      margin:20px auto 0;
      font-size:11px;
      color:var(--muted);
      line-height:1.75;
    }
    .venue{
      margin-top:40px;
      font-size:14px;
      letter-spacing:.06em;
    }
    .motif{
      position:fixed;
      inset:0;
      pointer-events:none;
      overflow:hidden;
      z-index:0;
    }
    .botanical{
      position:absolute;
      width:250px;
      height:310px;
      opacity:.11;
    }
    .botanical.top{top:-45px;left:-58px;transform:rotate(-8deg)}
    .botanical.bottom{right:-62px;bottom:-54px;transform:rotate(174deg);opacity:.09}
    .botanical svg{width:100%;height:100%;overflow:visible}
    .branch,.twig,.leaf,.maple,.berry{
      fill:none;stroke:var(--accent);stroke-linecap:round;stroke-linejoin:round;
    }
    .branch{stroke-width:1.35}
    .twig{stroke-width:.9}
    .leaf{stroke-width:1}
    .maple{stroke-width:.9}
    .berry{stroke-width:.85}
    @media(max-width:480px){
      .wrap{padding:14px 9px 28px}
      .card{padding:34px 16px 30px;border-radius:18px}
      h1{font-size:23px}
      .message{font-size:14px}
      .button{width:100%;min-width:0}
    }
  </style>
</head>
<body>
  <div class="motif" aria-hidden="true">
    <div class="botanical top">
      <svg viewBox="0 0 250 310" xmlns="http://www.w3.org/2000/svg">
        <path class="branch" d="M22 300 C52 250,78 215,108 169 C135 127,157 83,174 16"/>
        <path class="twig" d="M71 227 C49 210,36 192,29 171"/>
        <path class="twig" d="M99 182 C77 165,65 146,59 126"/>
        <path class="twig" d="M126 140 C147 127,162 111,171 91"/>
        <path class="leaf" d="M27 172 C8 156,8 135,29 128 C48 139,47 158,27 172 Z"/>
        <path class="twig" d="M28 170 L31 132"/>
        <path class="leaf" d="M170 91 C188 73,208 77,212 97 C198 114,180 110,170 91 Z"/>
        <path class="twig" d="M173 91 L207 96"/>
        <path class="maple" d="M45 204 l-11 -9 3 13 -12 -2 9 10 -9 5 13 2 -2 14 10 -10 8 10 -1 -14 13 -2 -10 -6 8 -10 -12 3 2 -13 z"/>
        <circle class="berry" cx="160" cy="55" r="3.5"/>
        <circle class="berry" cx="168" cy="49" r="3"/>
        <circle class="berry" cx="175" cy="58" r="3.2"/>
      </svg>
    </div>
    <div class="botanical bottom">
      <svg viewBox="0 0 250 310" xmlns="http://www.w3.org/2000/svg">
        <path class="branch" d="M22 300 C52 250,78 215,108 169 C135 127,157 83,174 16"/>
        <path class="twig" d="M71 227 C49 210,36 192,29 171"/>
        <path class="twig" d="M126 140 C147 127,162 111,171 91"/>
        <path class="leaf" d="M27 172 C8 156,8 135,29 128 C48 139,47 158,27 172 Z"/>
        <path class="leaf" d="M170 91 C188 73,208 77,212 97 C198 114,180 110,170 91 Z"/>
        <path class="maple" d="M45 204 l-11 -9 3 13 -12 -2 9 10 -9 5 13 2 -2 14 10 -10 8 10 -1 -14 13 -2 -10 -6 8 -10 -12 3 2 -13 z"/>
      </svg>
    </div>
  </div>

  <main class="wrap">
    <section class="card">
      <div class="eyebrow">Wedding Day</div>
      <h1>SHARE YOUR PHOTOS</h1>
      <div class="date">2026.09.27</div>

      <div class="divider"></div>

      <div class="camera" aria-hidden="true">
        <svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 27h9l4-6h14l4 6h9a5 5 0 0 1 5 5v25a5 5 0 0 1-5 5H20a5 5 0 0 1-5-5V32a5 5 0 0 1 5-5z"/>
          <circle cx="40" cy="44" r="11"/>
          <circle cx="57" cy="34" r="1.8"/>
          <path d="M31 17c4-3 14-3 18 0"/>
        </svg>
      </div>

      <div class="message">
        今日という一日を、<br>
        皆さまの目線でも残していただけたら嬉しいです。<br>
        お撮りいただいた写真をぜひシェアしてください。
        <div class="sub">アルバムでは、皆さまから共有いただいた写真もご覧いただけます。</div>
      </div>

      <a class="button" href="https://photos.app.goo.gl/dw5QdmvUtdUV2ExD6" target="_blank" rel="noopener noreferrer">
        写真を見る・追加する
      </a>

      <p class="note">
        Google フォトの共有アルバムが開きます。<br>
        写真を追加する際、Google アカウントへのログインを求められる場合があります。<br><br>
        アルバムへのアクセスや写真の追加ができない場合は、<br>
        新郎または新婦へ直接写真をお送りください。
      </p>

      <div class="venue">ホテル椿山荘東京</div>
    </section>
  </main>
</body>
</html>
